<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebAuthn 学習用サーバー</title>
</head>
<body>
  <h1>WebAuthn 学習用サーバー</h1>
  <button type="button" id="register">パスキーを作成</button>
  <button type="button" id="login">パスキーでログイン</button>
  <p id="status" role="status"></p>

  <script>
    const registerButton = document.querySelector("#register");
    const loginButton = document.querySelector("#login");
    const status = document.querySelector("#status");

    function decodeBase64URL(value) {
      const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
      return Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
    }

    function encodeBase64URL(buffer) {
      const binary = Array.from(new Uint8Array(buffer), (byte) => String.fromCharCode(byte)).join("");
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function setButtonsDisabled(disabled) {
      registerButton.disabled = disabled;
      loginButton.disabled = disabled;
    }

    registerButton.addEventListener("click", async () => {
      setButtonsDisabled(true);
      status.textContent = "パスキーを作成しています。";
      try {
        const response = await fetch("/register/options", { method: "POST" });
        if (!response.ok) {
          throw new Error(`登録オプションの取得に失敗しました（HTTP ${response.status}）。`);
        }

        const registrationOptions = await response.json();
        registrationOptions.challenge = decodeBase64URL(registrationOptions.challenge);
        registrationOptions.user.id = decodeBase64URL(registrationOptions.user.id);
        for (const credential of registrationOptions.excludeCredentials) {
          credential.id = decodeBase64URL(credential.id);
        }

        const credential = await navigator.credentials.create({ publicKey: registrationOptions });
        const finish = await fetch("/register/finish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            rawId: encodeBase64URL(credential.rawId),
            response: {
              clientDataJSON: encodeBase64URL(credential.response.clientDataJSON),
              attestationObject: encodeBase64URL(credential.response.attestationObject),
            },
          }),
        });
        if (!finish.ok) {
          throw new Error(`作成結果の送信に失敗しました（HTTP ${finish.status}）。`);
        }
        status.textContent = "パスキーを登録しました。";
      } catch (error) {
        status.textContent = error.name === "NotAllowedError"
          ? "パスキーの作成を完了できませんでした。キャンセルした場合は、ボタンからやり直せます。"
          : error.message;
      } finally {
        setButtonsDisabled(false);
      }
    });

    loginButton.addEventListener("click", async () => {
      setButtonsDisabled(true);
      status.textContent = "パスキーで認証しています。";
      try {
        const response = await fetch("/login/options", { method: "POST" });
        if (response.status === 409) {
          throw new Error("先にパスキーを作成してください。");
        }
        if (!response.ok) {
          throw new Error(`認証オプションの取得に失敗しました（HTTP ${response.status}）。`);
        }

        const loginOptions = await response.json();
        loginOptions.challenge = decodeBase64URL(loginOptions.challenge);
        for (const credential of loginOptions.allowCredentials) {
          credential.id = decodeBase64URL(credential.id);
        }

        const credential = await navigator.credentials.get({ publicKey: loginOptions });
        const assertionResponse = {
          clientDataJSON: encodeBase64URL(credential.response.clientDataJSON),
          authenticatorData: encodeBase64URL(credential.response.authenticatorData),
          signature: encodeBase64URL(credential.response.signature),
        };
        if (credential.response.userHandle !== null) {
          assertionResponse.userHandle = encodeBase64URL(credential.response.userHandle);
        }

        const finish = await fetch("/login/finish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            rawId: encodeBase64URL(credential.rawId),
            response: assertionResponse,
          }),
        });
        if (finish.status === 501) {
          status.textContent = "資格情報と認証応答の内容を照合しました。署名の検証は Step 5 の後続項目で実装します。";
          return;
        }
        if (!finish.ok) {
          throw new Error(`認証応答の送信に失敗しました（HTTP ${finish.status}）。`);
        }
        status.textContent = "認証応答を送信しました。";
      } catch (error) {
        status.textContent = error.name === "NotAllowedError"
          ? "パスキーの操作を完了できませんでした。ボタンからやり直せます。"
          : error.message;
      } finally {
        setButtonsDisabled(false);
      }
    });
  </script>
</body>
</html>
